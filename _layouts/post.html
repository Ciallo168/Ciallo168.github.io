<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title }} | {{ site.title }}</title>
<meta name="description" content="{{ site.description }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Archivo:wght@400;500&family=Archivo+Narrow:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/assets/css/formwork.css' | relative_url }}" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <div class="bar-in">
    <a class="mark" href="/">MikiP</a>
    <nav>
      <a href="/">首页</a>
      <a href="/#tools">工具</a>
      <a href="/about/">关于</a>
    </nav>
  </div>
</header>

<main>
  <article class="article wrap">
    <div class="article-inner">
      <header class="article-head">
        <h1>{{ page.title }}</h1>
        <div class="meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time>
          {% if page.categories %}<span class="tag">{{ page.categories | join: " / " }}</span>{% endif %}
          {% if page.tags %}<span>{{ page.tags | join: " / " }}</span>{% endif %}
        </div>
      </header>
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </article>
</main>

<footer>
  <div class="foot-in">
    <span>MikiP</span>
    <span class="foot-links">
      <a href="/">返回首页</a>
      <a href="https://github.com/Ciallo168">GitHub</a>
    </span>
  </div>
</footer>

</body>
</html>
