<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地音乐播放器</title>
<meta name="description" content="拖入音频文件或整个文件夹，在浏览器里连续播放。文件只在本地读取，不上传。" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* Hallmark · redesign: full · scope: app · theme: Rim · colourway: night · genre: modern-minimal · v2.5 · lang: zh
   nav: the name and one back link, no wordmark row · footer: one line · job: listen · surface: none
   pre-emit critique: P4 H4 E4 S4 R5 · weakest: P, a player makes no argument; the queue carries it, so every row is a measured line */
:root {
  --color-paper: oklch(9% 0.008 75);
  --color-paper-2: oklch(12.5% 0.009 75);
  --color-paper-3: oklch(6.5% 0.007 75);
  --color-ink: oklch(94% 0.010 80);
  --color-ink-2: oklch(84% 0.011 80);
  --color-muted: oklch(68% 0.012 80);
  --color-muted-2: oklch(50% 0.010 80);
  --color-rule: oklch(25% 0.010 78);
  --color-rule-2: oklch(16% 0.009 78);
  --color-accent: oklch(72% 0.17 45);
  --color-accent-ink: oklch(10% 0.02 45);
  --color-accent-2: oklch(74% 0.12 250);
  --color-focus: oklch(78% 0.15 45);

  --font-display: "Switzer", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  --font-body: var(--font-display);
  --font-outlier: "Geist Mono", ui-monospace, monospace;

  --radius-card: 0;
  --radius-pill: 0;
  --rule-hair: 1px;
  --tracking-display: -0.04em;
  --display-weight: 500;

  --space-3xs: 2px;
  --space-2xs: 4px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 40px;
  --space-2xl: 64px;
  --space-3xl: 96px;

  --text-xs: 12px;
  --text-s: 13px;
  --text-m: 16px;
  --text-l: 17px;

  --dur-short: 200ms;
  --dur-med: 320ms;
  --ease-out: cubic-bezier(0.2, 0.6, 0.2, 1);

  --z-sticky: 200;
  --z-toast: 500;
  --measure: 1120px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { overflow-x: clip; background: var(--color-paper); }

body {
  font-family: var(--font-body);
  font-size: var(--text-m);
  line-height: 1.55;
  color: var(--color-ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 0;
  -webkit-font-smoothing: antialiased;
}

::selection { background: color-mix(in oklab, var(--color-accent) 35%, transparent); color: var(--color-ink); }
html { scrollbar-color: var(--color-rule) var(--color-paper); }
body { caret-color: var(--color-accent); }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* ---------- nav ---------- */
.nav { border-bottom: var(--rule-hair) solid var(--color-rule); }
.nav-in {
  max-width: var(--measure);
  margin: 0 auto;
  padding: var(--space-md) clamp(var(--space-md), 4vw, var(--space-xl));
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.brand { font-size: var(--text-s); font-weight: 500; letter-spacing: -0.01em; }
.nav-links { margin-left: auto; display: flex; gap: var(--space-lg); }
.nav-links a {
  font-size: var(--text-s);
  font-weight: 500;
  color: var(--color-muted);
  text-decoration: none;
  transition: color var(--dur-short) var(--ease-out);
}
.nav-links a:hover { color: var(--color-ink); text-decoration: underline; text-underline-offset: 4px; }

/* ---------- layout ---------- */
main { flex: 1; }
.wrap {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 0 clamp(var(--space-md), 4vw, var(--space-xl));
}

/* ---------- hero ---------- */
.hero {
  padding: clamp(var(--space-xl), 5vw, var(--space-2xl)) 0;
  border-bottom: var(--rule-hair) solid var(--color-rule);
}
body:not(.has-player) .hero {
  display: flex;
  align-items: center;
  min-height: calc(100vh - 96px);
}
body:not(.has-player) .hero-in { width: 100%; }
body.has-player { padding-bottom: 148px; }
.hero-in {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: clamp(var(--space-lg), 6vw, var(--space-2xl));
  align-items: start;
}
h1 {
  font-weight: var(--display-weight);
  font-size: clamp(34px, 4.4vw, 58px);
  letter-spacing: var(--tracking-display);
  line-height: 1.04;
  text-wrap: balance;
  overflow-wrap: break-word;
  min-width: 0;
}
.lede {
  margin-top: var(--space-md);
  font-size: var(--text-l);
  color: var(--color-ink-2);
  max-width: 100%;
  text-wrap: pretty;
}
.note {
  margin-top: var(--space-xs);
  font-size: var(--text-s);
  color: var(--color-muted);
  text-wrap: pretty;
}
.fmt-list { margin-top: var(--space-lg); display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.fmt-list span {
  font-family: var(--font-outlier);
  font-size: var(--text-xs);
  color: var(--color-muted);
  border: var(--rule-hair) solid var(--color-rule);
  padding: var(--space-3xs) var(--space-xs);
}

/* ---------- drop ---------- */
.drop {
  position: relative;
  background: var(--color-paper-2);
  border: var(--rule-hair) solid var(--color-rule);
  padding: var(--space-lg);
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.ticks::before, .ticks::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 0 solid var(--color-muted);
  pointer-events: none;
  z-index: 10;
}
.ticks::before { top: calc(-1 * var(--space-xs)); left: calc(-1 * var(--space-xs)); border-width: 1px 0 0 1px; }
.ticks::after { right: calc(-1 * var(--space-xs)); bottom: calc(-1 * var(--space-xs)); border-width: 0 1px 1px 0; }
.drop:hover, .drop.drag { background: var(--color-paper); border-color: var(--color-muted); }
.drop-k { font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); margin-bottom: var(--space-sm); }
.drop-line { font-size: var(--text-l); font-weight: 500; }
.drop-note { margin: var(--space-2xs) 0 var(--space-md); font-size: var(--text-s); color: var(--color-muted); }
.drop-btns { display: flex; flex-direction: column; gap: var(--space-xs); }
.collapse-hint { display: none; font-size: var(--text-s); color: var(--color-muted); }
.mobile-tip { display: none; margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }

#dropzone.collapsed {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) var(--space-md);
  flex-wrap: wrap;
}
#dropzone.collapsed .drop-k,
#dropzone.collapsed .drop-line,
#dropzone.collapsed .drop-note,
#dropzone.collapsed .drop-btns,
#dropzone.collapsed .mobile-tip { display: none; }
#dropzone.collapsed .collapse-hint { display: block; }
#dropzone.collapsed .collapse-hint b {
  font-family: var(--font-outlier);
  font-weight: 400;
  color: var(--color-ink);
}

input[type=file] { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  padding: var(--space-sm) var(--space-md);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: var(--radius-pill);
  background: none;
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-s);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
}
.btn:hover { border-color: var(--color-muted); }
.btn:active { background: var(--color-paper-3); }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn--primary:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); border-color: transparent; }
.btn--primary:active { background: color-mix(in oklab, var(--color-accent) 76%, var(--color-paper-3)); }
.btn--quiet { border-color: transparent; color: var(--color-muted); padding-inline: var(--space-xs); }
.btn--quiet:hover { color: var(--color-ink); border-color: transparent; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- list ---------- */
#listPanel { display: none; padding: var(--space-xl) 0 var(--space-2xl); }
.list-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-md);
  flex-wrap: wrap;
  padding-bottom: var(--space-sm);
  border-bottom: var(--rule-hair) solid var(--color-ink);
}
.sec-head { font-size: var(--text-s); font-weight: 500; letter-spacing: -0.03em; color: var(--color-ink); }
.head-left { display: flex; align-items: baseline; gap: var(--space-xs); }
.count {
  margin-left: 0;
  font-family: var(--font-outlier);
  font-size: var(--text-xs);
  color: var(--color-muted);
}
.count b { font-weight: 400; color: var(--color-ink); }
.head-tools { display: flex; align-items: center; gap: var(--space-xs); }
#search {
  width: 220px;
  padding: var(--space-xs) var(--space-sm);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-s);
}
#search::placeholder { color: var(--color-muted-2); }
#search:hover { border-color: var(--color-muted-2); }

#tabs { display: flex; gap: var(--space-xs); flex-wrap: wrap; margin: var(--space-md) 0 var(--space-2xs); }
.tab {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  padding: var(--space-2xs) var(--space-sm);
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: 0;
  background: none;
  color: var(--color-muted);
  font-family: var(--font-body);
  font-size: var(--text-s);
  font-weight: 500;
  cursor: pointer;
  transition: color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.tab:hover { color: var(--color-ink); border-color: var(--color-muted-2); }
.tab.active { color: var(--color-ink); border-color: var(--color-muted); }
.tab.active .n { color: var(--color-accent); }
.tab .dir-icon { display: none; }
.tab .n { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted-2); }

#tracks { list-style: none; }
.track {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  min-width: 0;
  padding: var(--space-sm) var(--space-xs);
  border-bottom: var(--rule-hair) solid var(--color-rule);
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out);
}
.track:hover { background: var(--color-paper-2); }
.track.active { background: var(--color-paper-2); box-shadow: inset 2px 0 0 var(--color-accent); }
.track .idx {
  width: 28px;
  flex-shrink: 0;
  font-family: var(--font-outlier);
  font-size: var(--text-xs);
  color: var(--color-muted-2);
  text-align: right;
}
.track.active .idx { color: var(--color-accent); }
.track .eq { display: none; width: 28px; gap: var(--space-3xs); align-items: flex-end; justify-content: flex-end; height: 12px; flex-shrink: 0; }
.track.playing .eq { display: flex; }
.track.playing .idx { display: none; }
.eq span { width: 3px; background: var(--color-accent); }
.eq span:nth-child(1) { height: 60%; }
.eq span:nth-child(2) { height: 100%; }
.eq span:nth-child(3) { height: 40%; }
.track .name {
  flex: 1;
  min-width: 0;
  font-size: var(--text-s);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track .dur {
  flex-shrink: 0;
  font-family: var(--font-outlier);
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
  color: var(--color-muted);
}
.track .del {
  flex-shrink: 0;
  border: none;
  background: none;
  color: var(--color-muted-2);
  font-size: var(--text-s);
  padding: var(--space-2xs) var(--space-xs);
  cursor: pointer;
  transition: color var(--dur-short) var(--ease-out);
}
.track .del:hover { color: var(--color-accent); }
.empty-tip {
  padding: var(--space-xl) 0;
  font-size: var(--text-s);
  color: var(--color-muted);
  border-bottom: var(--rule-hair) solid var(--color-rule);
}

/* ---------- player bar ---------- */
#player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  z-index: var(--z-sticky);
  background: var(--color-paper-2);
  border-top: var(--rule-hair) solid var(--color-rule);
  padding: var(--space-sm) 0 calc(var(--space-sm) + env(safe-area-inset-bottom));
}
.player-wrap { display: block; }
.seek-row { display: flex; align-items: center; gap: var(--space-sm); }
.seek-row .measure {
  font-family: var(--font-outlier);
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
  color: var(--color-muted);
  min-width: 40px;
}
.seek-row .measure:last-child { text-align: right; }
.prow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: var(--space-lg);
  margin-top: var(--space-xs);
}
.now { min-width: 0; }
.pctrl { justify-self: center; }
.vol { justify-self: end; }
.nm {
  font-size: var(--text-s);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.st {
  margin-top: var(--space-3xs);
  font-family: var(--font-outlier);
  font-size: var(--text-xs);
  color: var(--color-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pctrl { display: flex; align-items: center; gap: var(--space-2xs); }

.pbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: var(--rule-hair) solid var(--color-rule);
  border-radius: 0;
  background: none;
  color: var(--color-ink-2);
  cursor: pointer;
  transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.pbtn:hover { color: var(--color-ink); border-color: var(--color-muted-2); background: var(--color-paper-3); }
.pbtn.on { color: var(--color-accent); border-color: color-mix(in oklab, var(--color-accent) 45%, transparent); }
.pbtn svg { display: block; }
.pbtn { position: relative; }
.pbtn .rep-arrow, .rep-one { display: none; }
#repeatBtn[data-repeat="1"] .rep-one { display: block; }
#repeatBtn[data-repeat="2"] .rep-loop,
#repeatBtn[data-repeat="3"] .rep-loop { display: none; }
#repeatBtn[data-repeat="2"] .rep-arrow,
#repeatBtn[data-repeat="3"] .rep-arrow { display: block; }
#repeatBtn[data-repeat="3"] .rep-one { display: block; }
.rep-one {
  position: absolute;
  top: 1px;
  right: 2px;
  font-family: var(--font-outlier);
  font-size: 9px;
  line-height: 1;
  color: inherit;
}

.pbtn.play {
  width: 44px;
  height: 44px;
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: var(--color-accent-ink);
  margin-inline: var(--space-xs);
}
.pbtn.play:hover { background: color-mix(in oklab, var(--color-accent) 88%, var(--color-ink)); border-color: transparent; color: var(--color-accent-ink); }
.pbtn.play:active { background: color-mix(in oklab, var(--color-accent) 76%, var(--color-paper-3)); }
.pbtn.play .ico-pause { display: none; }
.pbtn.play.is-playing .ico-play { display: none; }
.pbtn.play.is-playing .ico-pause { display: block; }

.vol { display: flex; align-items: center; gap: var(--space-xs); }
.vol .k { font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); white-space: nowrap; }

/* ---------- ranges ---------- */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--color-rule-2);
  border-radius: 0;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border: 2px solid var(--color-paper-2);
  border-radius: 0;
  background: var(--color-ink);
}
input[type=range]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 2px solid var(--color-paper-2);
  border-radius: 0;
  background: var(--color-ink);
}
input[type=range]:hover::-webkit-slider-thumb { background: var(--color-accent); }
input[type=range]:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 6px; }
#seek { flex: 1; }
#volume { width: 96px; }

/* ---------- footer ---------- */
footer {
  border-top: var(--rule-hair) solid var(--color-rule);
  padding: var(--space-md) clamp(var(--space-md), 4vw, var(--space-xl));
  font-size: var(--text-xs);
  color: var(--color-muted-2);
}
.foot-in { max-width: var(--measure); margin: 0 auto; }

/* ---------- toast ---------- */
#toast {
  position: fixed;
  top: var(--space-md);
  left: 50%;
  transform: translateX(-50%) translateY(-160%);
  background: var(--color-paper-2);
  border: var(--rule-hair) solid var(--color-rule);
  color: var(--color-ink);
  padding: var(--space-xs) var(--space-md);
  font-size: var(--text-s);
  max-width: calc(100% - var(--space-lg));
  opacity: 0;
  visibility: hidden;
  transition: transform var(--dur-med) var(--ease-out), opacity var(--dur-med) var(--ease-out), visibility var(--dur-med);
  z-index: var(--z-toast);
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }

@media (max-width: 860px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); }
  .drop { margin-top: var(--space-lg); }
  .prow { gap: var(--space-md); }
}
@media (max-width: 600px) {
  body.has-player { padding-bottom: 176px; }
  h1 { font-size: clamp(30px, 8vw, 40px); }
  .list-head { gap: var(--space-xs); }
  #search { width: 100%; }
  .head-tools { width: 100%; }
  .prow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "now now" "ctrl vol";
    align-items: center;
  }
  .now { grid-area: now; }
  .pctrl { grid-area: ctrl; }
  .vol { grid-area: vol; justify-self: end; }
  #volume { width: 72px; }
  .pbtn { width: 32px; height: 32px; }
  .pbtn.play { width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <span class="brand">本地音乐播放器</span>
    <nav class="nav-links">
      <a href="/">首页</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap hero-in">
      <div>
        <h1>Local Player</h1>
        <p class="lede">拖入音频文件，或直接选一个文件夹，在浏览器里连着播。</p>
        <p class="note">文件只在本地读取，不上传，刷新即清空。</p>
        <div class="fmt-list">
          <span>MP3</span><span>FLAC</span><span>WAV</span><span>OGG</span><span>M4A</span><span>AAC</span><span>OPUS</span>
        </div>
      </div>
      <div id="dropzone" class="drop ticks">
        <div class="drop-k">输入</div>
        <div class="drop-line">将音频文件或文件夹拖到此处</div>
        <div class="drop-note" id="desktopHint">支持 mp3、flac、wav、ogg、m4a、aac、opus</div>
        <div class="drop-btns">
          <button class="btn btn--primary" id="pickFiles">选择音频文件</button>
          <button class="btn" id="pickFolder">选择文件夹</button>
        </div>
        <div class="mobile-tip" id="mobileTip">手机端不支持选择文件夹，可多选音频文件</div>
        <span class="collapse-hint">已添加 <b id="collapseCount">0</b> 首，点击继续添加</span>
      </div>
      <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.flac,.wav,.ogg,.m4a,.aac,.opus,.webm" />
      <input type="file" id="folderInput" multiple webkitdirectory directory />
    </div>
  </section>

  <section id="listPanel">
    <div class="wrap">
      <div class="list-head">
        <div class="head-left">
          <h2 class="sec-head">播放列表</h2>
          <span class="count"><b id="count">0</b> 首</span>
        </div>
        <div class="head-tools">
          <input type="text" id="search" placeholder="搜索曲目" aria-label="搜索曲目" />
          <button class="btn btn--quiet" id="clearBtn">清空</button>
        </div>
      </div>
      <div id="tabs"></div>
      <ul id="tracks"></ul>
    </div>
  </section>
</main>

<div id="player">
  <div class="wrap player-wrap">
    <div class="seek-row">
      <span class="measure" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放进度" />
      <span class="measure" id="dur">0:00</span>
    </div>
    <div class="prow">
      <div class="now">
        <div class="nm" id="npName">未在播放</div>
        <div class="st" id="npStatus">从上方拖入文件开始</div>
      </div>
      <div class="pctrl">
        <button class="pbtn" id="shuffleBtn" title="随机播放" aria-label="随机播放">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 4h3l6 8h3M2 12h3l2-2.7M10 5.3 12 4h2"/><path d="M12.5 1.8 14.5 4l-2 2.2M12.5 9.8 14.5 12l-2 2.2"/></svg>
        </button>
        <button class="pbtn" id="prevBtn" title="上一首" aria-label="上一首">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="1.6" height="10"/><path d="M13 3v10L4.6 8z"/></svg>
        </button>
        <button class="pbtn play" id="playBtn" title="播放或暂停" aria-label="播放或暂停">
          <svg class="ico-play" aria-hidden="true" width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M1 1.2v13.6L13 8z"/></svg>
          <svg class="ico-pause" aria-hidden="true" width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><rect x="1" y="1" width="4" height="14"/><rect x="9" y="1" width="4" height="14"/></svg>
        </button>
        <button class="pbtn" id="nextBtn" title="下一首" aria-label="下一首">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="12.4" y="3" width="1.6" height="10"/><path d="M3 3v10l8.4-5z"/></svg>
        </button>
        <button class="pbtn" id="repeatBtn" data-repeat="0" title="列表循环" aria-label="循环模式">
          <svg class="rep-loop" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 6.5V6a2 2 0 0 1 2-2h8"/><path d="M11 2.2 13.2 4 11 5.8"/><path d="M13 9.5v.5a2 2 0 0 1-2 2H3"/><path d="M5 10.2 2.8 12 5 13.8"/></svg>
          <svg class="rep-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 8h11"/><path d="M10.2 5.2 13 8l-2.8 2.8"/></svg>
          <span class="rep-one">1</span>
        </button>
      </div>
      <div class="vol">
        <span class="k">音量</span>
        <input type="range" id="volume" min="0" max="100" value="100" aria-label="音量" />
      </div>
    </div>
  </div>
</div>

<audio id="audio"></audio>
<div id="toast"></div>

<footer><div class="foot-in">纯本地播放，刷新后列表清空，不留下任何文件</div></footer>

<script>

(function () {
  'use strict';

  var AUDIO_EXT = /\.(mp3|flac|wav|ogg|oga|m4a|aac|opus|webm|wma|amr|3gp)$/i;

  var tracks = [];      // { name, url, file, duration, folderKey, folderLabel, root }
  var current = -1;
  var shuffle = false;
  var repeat = 0;       // 0=列表循环 1=单曲循环 2=顺序播放(到最后停止) 3=单曲播放一次(播完即停)
  var activeFolder = '__all__';  // 当前选中的文件夹标签，__all__ 表示全部
  var LOOSE_KEY = '@loose';        // 散装文件（非文件夹上传）的分组键
  var shuffleHistory = [];

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  /* ---------- 提示 ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- 工具 ---------- */
  function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function basename(path, name) {
    if (name) return name.replace(/\.[^.]+$/, '');
    var parts = String(path).replace(/\\/g, '/').split('/');
    var f = parts[parts.length - 1];
    return f.replace(/\.[^.]+$/, '');
  }

  /* ---------- 文件夹分组 ----------
   * 根据文件相对路径得到所属文件夹标签：
   *  - 直接选择的散装文件 → 「未分组」
   *  - 上传文件夹根部的文件 → 标签为根文件夹名
   *  - 嵌套子文件夹里的文件 → 标签为相对子路径，如 Rock / Rock/90s
   */
  function folderInfoOf(file) {
    var rel = file.webkitRelativePath || file._relPath || file.name || '';
    var parts = String(rel).replace(/\\/g, '/').split('/').filter(Boolean);
    if (parts.length <= 1) {
      return { key: LOOSE_KEY, label: '未分组', root: '' };
    }
    var root = parts[0];
    var sub = parts.slice(1, -1);           // 根与文件之间的子目录
    if (sub.length === 0) {
      return { key: root, label: root, root: root };           // 文件夹根部文件
    }
    return { key: root + '/' + sub.join('/'), label: sub.join('/'), root: root };
  }

  /* ---------- 上传区折叠/展开 ---------- */
  var dzEl = $('dropzone');
  function collapseDropzone() {
    if (tracks.length === 0) return;  // 没有曲目时保持展开
    $('collapseCount').textContent = tracks.length;
    dzEl.classList.add('collapsed');
  }
  function expandDropzone() {
    dzEl.classList.remove('collapsed');
  }

  /* ---------- 添加文件 ---------- */
  function addFiles(fileList) {
    var added = 0;
    Array.prototype.forEach.call(fileList, function (file) {
      var name = file.name;
      if (!AUDIO_EXT.test(name)) return;
      // 同名去重
      if (tracks.some(function (t) { return t.name === name && t.file.size === file.size; })) return;
      var fi = folderInfoOf(file);
      tracks.push({
        name: name.replace(/\.[^.]+$/, ''),
        fullName: name,
        url: URL.createObjectURL(file),
        file: file,
        duration: null,
        folderKey: fi.key,
        folderLabel: fi.label,
        root: fi.root
      });
      added++;
    });
    if (added > 0) {
      renderList();
      collapseDropzone();
      toast('已添加 ' + added + ' 首曲目' + (added < fileList.length ? '（已过滤非音频文件）' : ''));
    } else if (fileList.length > 0) {
      toast('没有发现支持的音频文件');
    }
  }

  /* ---------- 文件夹递归读取（拖入文件夹） ---------- */
  function readEntries(reader) {
    return new Promise(function (resolve) {
      reader.readEntries(function (entries) { resolve(entries); });
    });
  }
  function traverseEntry(entry, files) {
    return new Promise(function (resolve) {
      if (entry.isFile) {
        entry.file(function (file) {
          // 保留相对路径（文件夹内的层级）
          Object.defineProperty(file, '_relPath', { value: entry.fullPath.slice(1), configurable: true });
          files.push(file);
          resolve();
        }, function () { resolve(); });
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        (function loop() {
          readEntries(reader).then(function (entries) {
            if (!entries.length) { resolve(); return; }
            Promise.all(entries.map(function (e) { return traverseEntry(e, files); })).then(loop);
          });
        })();
      } else { resolve(); }
    });
  }
  async function handleDataTransfer(dt) {
    var files = [];
    var items = dt.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
      var promises = [];
      for (var i = 0; i < items.length; i++) {
        var entry = items[i].webkitGetAsEntry();
        if (entry) promises.push(traverseEntry(entry, files));
      }
      await Promise.all(promises);
    }
    // 兜底：直接取 files
    if (!files.length && dt.files) {
      for (var j = 0; j < dt.files.length; j++) files.push(dt.files[j]);
    }
    // 按相对路径排序，保持文件夹内顺序
    files.sort(function (a, b) {
      var pa = a._relPath || a.name, pb = b._relPath || b.name;
      return pa < pb ? -1 : pa > pb ? 1 : 0;
    });
    addFiles(files);
  }

  /* ---------- 文件夹标签与筛选 ---------- */
  // 汇总所有文件夹分组（按 key 排序，未分组排最后）
  function getFolderGroups() {
    var map = Object.create(null);
    tracks.forEach(function (t) {
      if (!map[t.folderKey]) map[t.folderKey] = { key: t.folderKey, label: t.folderLabel, count: 0, root: t.root };
      map[t.folderKey].count++;
    });
    var groups = Object.keys(map).map(function (k) { return map[k]; });
    // 同名标签消歧义：拼上根文件夹名
    var labelSeen = Object.create(null);
    groups.forEach(function (g) {
      var base = g.label.split('/').pop();
      if (labelSeen[base] === undefined) labelSeen[base] = g.key;
      else labelSeen[base] = '__multi__';
    });
    groups.forEach(function (g) {
      var base = g.label.split('/').pop();
      g.short = (labelSeen[base] === '__multi__' && g.root && g.label.indexOf(g.root) !== 0)
        ? g.root + ' / ' + g.label
        : g.label;
    });
    groups.sort(function (a, b) {
      if (a.key === LOOSE_KEY) return 1;
      if (b.key === LOOSE_KEY) return -1;
      return a.key.localeCompare(b.key, 'zh-Hans-CN', { numeric: true });
    });
    return groups;
  }

  // 当前标签 + 搜索关键词下，可见曲目的全局索引
  function visibleIndexes() {
    var kw = $('search').value.trim().toLowerCase();
    var out = [];
    tracks.forEach(function (t, i) {
      if (activeFolder !== '__all__' && t.folderKey !== activeFolder) return;
      if (kw && t.name.toLowerCase().indexOf(kw) === -1) return;
      out.push(i);
    });
    return out;
  }

  function renderTabs() {
    var box = $('tabs');
    var groups = getFolderGroups();
    // 只有一个分组时不需要标签栏
    if (groups.length <= 1) {
      box.style.display = 'none';
      box.innerHTML = '';
      if (groups.length === 1) activeFolder = '__all__';
      return;
    }
    box.style.display = 'flex';

    // 当前标签已不存在则回到「全部」
    if (activeFolder !== '__all__' && !groups.some(function (g) { return g.key === activeFolder; })) {
      activeFolder = '__all__';
    }

    var chips = [{ key: '__all__', short: '全部', count: tracks.length }].concat(groups);
    box.innerHTML = '';
    chips.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'tab' + (activeFolder === g.key ? ' active' : '');
      var icon = '';
      b.innerHTML = '<span class="dir-icon">' + icon + '</span><span class="lb"></span><span class="n"></span>';
      b.querySelector('.lb').textContent = g.short;
      b.querySelector('.n').textContent = g.count;
      b.title = g.key === '__all__' ? '全部曲目' : g.key;
      b.addEventListener('click', function () {
        activeFolder = g.key;
        renderTabs();
        renderList();
      });
      box.appendChild(b);
    });
  }

  /* ---------- 列表渲染 ---------- */
  function renderList() {
    var panel = $('listPanel'), ul = $('tracks'), kw = $('search').value.trim().toLowerCase();
    $('count').textContent = tracks.length;
    panel.style.display = tracks.length ? 'block' : 'none';
    $('player').style.display = tracks.length ? 'block' : 'none';
    document.body.classList.toggle('has-player', !!tracks.length);
    renderTabs();
    ul.innerHTML = '';

    var indexes = visibleIndexes();
    indexes.forEach(function (i, displayNo) {
      var t = tracks[i];
      var li = document.createElement('li');
      li.className = 'track' + (i === current ? ' active' : '') + (i === current && !audio.paused ? ' playing' : '');
      li.innerHTML =
        '<span class="idx">' + (displayNo + 1) + '</span>' +
        '<span class="eq"><span></span><span></span><span></span></span>' +
        '<span class="name"></span>' +
        '<span class="dur">' + (t.duration ? fmt(t.duration) : '–:–') + '</span>' +
        '<button class="del" title="移除">✕</button>';
      li.querySelector('.name').textContent = t.fullName;
      li.addEventListener('click', function (e) {
        if (e.target.classList.contains('del')) {
          removeTrack(i);
        } else {
          playAt(i);
        }
      });
      ul.appendChild(li);

      // 异步读取时长
      if (!t.duration) readDuration(t);
    });

    if (!indexes.length) {
      ul.innerHTML = kw
        ? '<div class="empty-tip">当前标签下没有匹配「' + $('search').value + '」的曲目</div>'
        : '<div class="empty-tip">该文件夹里没有音频文件</div>';
    }
  }

  function readDuration(t) {
    var url = t.url;
    var a = new Audio();
    a.preload = 'metadata';
    a.src = url;
    a.addEventListener('loadedmetadata', function () {
      t.duration = a.duration;
      if (tracks.indexOf(t) !== -1) renderList();  // 整体刷新时长文本
      a.src = '';
    });
    a.addEventListener('error', function () { a.src = ''; });
  }

  function removeTrack(i) {
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i, 1);
    if (i === current) {
      if (tracks.length === 0) {
        current = -1;
        audio.pause();
        audio.src = '';
        updateNowPlaying();
      } else {
        current = current >= tracks.length ? tracks.length - 1 : current;
        playAt(current);
      }
    } else if (i < current) {
      current--;
    }
    renderList();
    if (tracks.length === 0) {
      activeFolder = '__all__';
      expandDropzone();
    } else {
      $('collapseCount').textContent = tracks.length;
    }
  }

  /* ---------- 播放控制 ---------- */
  function playAt(i) {
    if (i < 0 || i >= tracks.length) return;
    current = i;
    audio.src = tracks[i].url;
    audio.play().catch(function () {});
    updateNowPlaying();
    renderList();
  }
  function updateNowPlaying() {
    if (current >= 0 && tracks[current]) {
      $('npName').textContent = tracks[current].fullName;
      var t = tracks[current];
      var folderTag = (t.folderKey === LOOSE_KEY) ? '' : '📁 ' + t.folderLabel + ' · ';
      $('npStatus').textContent = folderTag + '第 ' + (current + 1) + ' / ' + tracks.length + ' 首';
      $('playBtn').classList.toggle('is-playing', !audio.paused);
    } else {
      $('npName').textContent = '未在播放';
      $('npStatus').textContent = '从上方拖入文件开始';
      $('playBtn').classList.remove('is-playing');
      $('cur').textContent = '0:00';
      $('dur').textContent = '0:00';
      $('seek').value = 0;
    }
  }
  // 在当前标签 + 搜索结果范围内挑选下一首的全局索引；返回 -1 表示已到列表末尾
  function pickNext() {
    var list = visibleIndexes();
    if (!list.length) return -1;
    if (shuffle) {
      var n;
      do { n = list[Math.floor(Math.random() * list.length)]; }
      while (list.length > 1 && n === current);
      return n;
    }
    var pos = list.indexOf(current);
    if (pos === -1) return list[0];               // 当前曲目不在该标签内，播第一首
    return pos + 1 < list.length ? list[pos + 1] : -1;
  }
  function next(manual) {
    if (repeat === 1 && !manual) { playAt(current); return; }
    var list = visibleIndexes();
    if (!list.length) return;
    var n = pickNext();
    if (n === -1) {
      if (repeat === 2) { audio.pause(); updateNowPlaying(); return; } // 顺序播放：到末尾停止
      playAt(list[0]);                                                // 其余模式回到标签首曲
      return;
    }
    playAt(n);
  }
  function prev() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    var list = visibleIndexes();
    if (!list.length) return;
    var p;
    if (shuffle) {
      do { p = list[Math.floor(Math.random() * list.length)]; }
      while (list.length > 1 && p === current);
    } else {
      var pos = list.indexOf(current);
      p = pos <= 0 ? list[list.length - 1] : list[pos - 1];
    }
    playAt(p);
  }

  /* ---------- 音频事件 ---------- */
  audio.addEventListener('play', function () { $('playBtn').classList.add('is-playing'); renderList(); });
  audio.addEventListener('pause', function () { $('playBtn').classList.remove('is-playing'); renderList(); updateNowPlaying(); });
  audio.addEventListener('loadedmetadata', function () {
    $('dur').textContent = fmt(audio.duration);
    if (current >= 0 && tracks[current]) { tracks[current].duration = audio.duration; renderList(); }
  });
  audio.addEventListener('timeupdate', function () {
    $('cur').textContent = fmt(audio.currentTime);
    if (audio.duration) $('seek').value = Math.round(audio.currentTime / audio.duration * 1000);
  });
  audio.addEventListener('ended', function () {
    if (repeat === 3) {
      // 单曲播放一次：播完当前歌曲即停止，不自动切歌
      audio.pause();
      audio.currentTime = 0;
      $('seek').value = 0;
      $('cur').textContent = '0:00';
      updateNowPlaying();
      renderList();
      return;
    }
    next(false);
  });
  audio.addEventListener('error', function () {
    if (current >= 0 && tracks[current]) toast('无法播放：' + tracks[current].fullName);
  });

  $('playBtn').addEventListener('click', function () {
    if (!tracks.length) return;
    if (current === -1) {
      var first = visibleIndexes()[0];
      if (first !== undefined) playAt(first);
      return;
    }
    if (audio.paused) audio.play(); else audio.pause();
  });
  $('nextBtn').addEventListener('click', function () { next(true); });
  $('prevBtn').addEventListener('click', function () { prev(); });

  $('shuffleBtn').addEventListener('click', function () {
    shuffle = !shuffle;
    this.classList.toggle('on', shuffle);
    toast(shuffle ? '随机播放：开' : '随机播放：关');
  });
  $('repeatBtn').addEventListener('click', function () {
    repeat = (repeat + 1) % 4;
    var labels = ['列表循环', '单曲循环', '顺序播放（播完列表停止）', '单曲播放一次（播完即停）'];
    this.setAttribute('data-repeat', repeat);
    this.title = '循环模式：' + labels[repeat];
    this.classList.toggle('on', repeat === 0 || repeat === 1);
    toast(labels[repeat]);
  });

  $('seek').addEventListener('input', function () {
    if (audio.duration) audio.currentTime = this.value / 1000 * audio.duration;
  });
  $('volume').addEventListener('input', function () { audio.volume = this.value / 100; });

  /* ---------- 拖放 ---------- */
  var dragDepth = 0;
  var dz = dzEl;
  window.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth++;
    dz.classList.add('drag');
    // 折叠状态下拖入文件时自动展开，给出清晰的放置反馈
    if (tracks.length > 0) expandDropzone();
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; dz.classList.remove('drag'); }
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dz.classList.remove('drag');
    if (e.dataTransfer) handleDataTransfer(e.dataTransfer);
    // 拖放添加后 addFiles 会自动折叠；若没添加成功且有曲目，则恢复折叠
    if (tracks.length > 0) collapseDropzone();
  });

  /* ---------- 按钮 / 输入 ---------- */
  dz.addEventListener('click', function (e) {
    if (e.target.closest('.btn')) return;
    // 折叠状态：点击只展开，不直接弹文件框，避免误触
    if (dz.classList.contains('collapsed')) {
      expandDropzone();
      return;
    }
    $('fileInput').click();
  });
  $('pickFiles').addEventListener('click', function (e) { e.stopPropagation(); $('fileInput').click(); });
  $('pickFolder').addEventListener('click', function (e) { e.stopPropagation(); $('folderInput').click(); });
  $('fileInput').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  $('folderInput').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  $('search').addEventListener('input', renderList);
  $('clearBtn').addEventListener('click', function () {
    tracks.forEach(function (t) { URL.revokeObjectURL(t.url); });
    tracks = [];
    current = -1;
    activeFolder = '__all__';
    audio.pause();
    audio.src = '';
    $('search').value = '';
    renderList();
    updateNowPlaying();
    expandDropzone();
    toast('列表已清空');
  });

  /* ---------- 键盘快捷键 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); $('playBtn').click(); }
    if (e.code === 'ArrowRight' && e.ctrlKey) next(true);
    if (e.code === 'ArrowLeft' && e.ctrlKey) prev();
  });
})();
</script>
</body>
</html>
